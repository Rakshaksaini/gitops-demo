apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-mongo-mysql-app
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-mongo-mysql-app
  template:
    metadata:
      labels:
        app: flask-mongo-mysql-app
    spec:
      containers:
        - name: flask-app
          # Ensure this matches your local docker image tag:
          image: flask-mongo-mysql-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-app-config
            - secretRef:
                name: flask-app-secret
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-svc
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: flask-mongo-mysql-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
