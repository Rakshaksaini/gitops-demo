apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: default
  labels:
    app: sample-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Ek waqt me kitne extra pods ban sakte hain
      maxUnavailable: 0  # Zero downtime: Purana pod tabhi hatega jab naya Ready hoga
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: web
        image: my-app:v1.0       # <--- Sirf yahi tag v1.0 se v2.0 update hoga
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_VERSION
          value: "v1.0"
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: sample-app
